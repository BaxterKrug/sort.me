grid:
  column_spacing: 84.0  # mm between letter columns (A, B, C, etc.)
  row_spacing: 104.0    # mm between number rows (1, 2, 3)
  positions:
    # Row 1 (Y = 0)
    A1: [0, 0]       # X = 0, Y = 0 (reference point)
    B1: [106, 0]      # X = 84, Y = 0
    C1: [212, 0]     # X = 168, Y = 0
    D1: [318, 0]     # X = 252, Y = 0
    E1: [424, 0]     # X = 336, Y = 0
    F1: [530, 0]     # X = 420, Y = 0
    G1: [636, 0]     # X = 504, Y = 0
    H1: [742, 0]     # X = 588, Y = 0
    I1: [848, 0]     # X = 672, Y = 0
    J1: [954, 0]     # X = 756, Y = 0
    K1: [1060,0]     # X = 840, Y = 0
    # Row 2 (Y = 104)
    A2: [0, 135 ]     # X = 0, Y = 104
    B2: [106, 135 ]    # X = 84, Y = 104
    C2: [212, 135 ]   # X = 168, Y = 104
    D2: [318, 135 ]   # X = 252, Y = 104
    E2: [424, 135 ]   # X = 336, Y = 104
    F2: [530, 135 ]   # X = 420, Y = 104
    G2: [636, 135 ]   # X = 504, Y = 104
    H2: [742, 135 ]   # X = 588, Y = 104
    I2: [848, 135 ]   # X = 672, Y = 104
    J2: [954, 135 ]   # X = 756, Y = 104
    K2: [1060, 135 ]   # X = 840, Y = 104
    # Row 3 (Y = 208)
    A3: [0, 270]     # X = 0, Y = 208
    B3: [106, 270]    # X = 84, Y = 208
    C3: [212, 270]   # X = 168, Y = 208
    D3: [318, 270]   # X = 252, Y = 208
    E3: [424, 270]   # X = 336, Y = 208
    F3: [530, 270]   # X = 420, Y = 208
    G3: [636, 270]   # X = 504, Y = 208
    H3: [742, 270]   # X = 588, Y = 208
    I3: [848, 270]   # X = 672, Y = 208
    J3: [954, 270]   # X = 756, Y = 208
    K3: [1060, 270]   # X = 840, Y = 208
    # Error pile position (offset from grid)
    ERR1: [1100, 328] # X = 924, Y = 104 (next column over, middle row)
feeder:
  reserve_pattern: ^A\d+$
gcode:
  baud: 115200
  port: /dev/ttyACM1
  mcodes:
  # Vacuum/extruder test commands removed. Use plunger or raw gcode send if needed.
motion:
  default_speed: 1600.0     # Default movement speed in mm/min (doubled from 800)
  rapid_speed: 2400.0       # Fast positioning speed for non-critical moves (doubled from 1200)
  homing_speed: 800.0       # Speed for homing operations (doubled from 400)
overflow:
  cells:
  - ERR1
sorting:
  default_mode: alpha_exact
  low_confidence_threshold: 0.8
  near_full_threshold: 0.9
  modes:
    alpha_exact:
      label: Alphabetical (A–Z)
      type: alpha
      fallback: J3
    release_year:
      label: Release Year
      type: year
      fallback: K1
      mapping:
        "<=1995": B1
        "1996-2002": B2
        "2003-2009": B3
        "2010-2014": C1
        "2015-2017": C2
        "2018": C3
        "2019": D1
        "2020": D2
        "2021": D3
        "2022": E1
        "2023": E2
        "2024": E3
        ">=2025": F1
        "*": K1
    set_focus:
      label: Set Families
      type: set
      fallback: K2
      mapping:
        mh1: C1
        "modern horizons": C1
        mh2: C1
        grn: D1
        "guilds of ravnica": D1
        rna: D1
        one: D2
        "phyrexia: all will be one": D2
        neo: D3
        "kamigawa: neon dynasty": D3
        otj: E1
        "outlaws of thunder junction": E1
        eld: E2
        "throne of eldraine": E2
        khm: E3
        kaldheim: E3
        "*": K2
