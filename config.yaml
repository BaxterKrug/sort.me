grid:
  column_spacing: 84.0  # mm between letter columns (A, B, C, etc.)
  row_spacing: 132.0     # mm between number rows (1, 2, 3)
  positions:
    # Row 1 (Y = 0 + 28 = 28)
    A1: [10, 28]       # X = 0+12, Y = 0+28 (reference point)
    B1: [116, 28]      # X = 10 + (1*106), Y = 28 + (0*132)
    C1: [222, 28]      # X = 10 + (2*106), Y = 28 + (0*132)
    D1: [328, 28]      # X = 10 + (3*106), Y = 28 + (0*132)
    E1: [434, 28]      # X = 10 + (4*106), Y = 28 + (0*132)
    F1: [540, 28]      # X = 10 + (5*106), Y = 28 + (0*132)
    G1: [646, 28]      # X = 10 + (6*106), Y = 28 + (0*132)
    H1: [752, 28]      # X = 10 + (7*106), Y = 28 + (0*132)
    I1: [858, 28]      # X = 10 + (8*106), Y = 28 + (0*132)
    J1: [964, 28]      # X = 10 + (9*106), Y = 28 + (0*132)
    K1: [1070, 28]     # X = 10 + (10*106), Y = 28 + (0*132)
    # Row 2 (Y = 28 + 132 = 160)
    A2: [10, 160]      # X = 0+12, Y = 135+28
    B2: [116, 160]     # X = 10 + (1*106), Y = 28 + (1*132)
    C2: [222, 160]     # X = 10 + (2*106), Y = 28 + (1*132)
    D2: [328, 160]     # X = 10 + (3*106), Y = 28 + (1*132)
    E2: [434, 160]     # X = 10 + (4*106), Y = 28 + (1*132)
    F2: [540, 160]     # X = 10 + (5*106), Y = 28 + (1*132)
    G2: [646, 160]     # X = 10 + (6*106), Y = 28 + (1*132)
    H2: [752, 160]     # X = 10 + (7*106), Y = 28 + (1*132)
    I2: [858, 160]     # X = 10 + (8*106), Y = 28 + (1*132)
    J2: [964, 160]     # X = 10 + (9*106), Y = 28 + (1*132)
    K2: [1070, 160]    # X = 10 + (10*106), Y = 28 + (1*132)
    # Row 3 (Y = 28 + 264 = 292)
    A3: [10, 292]      # X = 0+12, Y = 270+28
    B3: [116, 292]     # X = 10 + (1*106), Y = 28 + (2*132)
    C3: [222, 292]     # X = 10 + (2*106), Y = 28 + (2*132)
    D3: [328, 292]     # X = 10 + (3*106), Y = 28 + (2*132)
    E3: [434, 292]     # X = 10 + (4*106), Y = 28 + (2*132)
    F3: [540, 292]     # X = 10 + (5*106), Y = 28 + (2*132)
    G3: [646, 292]     # X = 10 + (6*106), Y = 28 + (2*132)
    H3: [752, 292]     # X = 10 + (7*106), Y = 28 + (2*132)
    I3: [858, 292]     # X = 10 + (8*106), Y = 28 + (2*132)
    J3: [964, 292]     # X = 10 + (9*106), Y = 28 + (2*132)
    K3: [1070, 292]    # X = 10 + (10*106), Y = 28 + (2*132)
    # Error pile position (offset from grid)
    ERR1: [1110, 292]  # X = 1100+12, Y = 328+28
feeder:
  reserve_pattern: ^A\d+$
gcode:
  baud: 115200
  port: /dev/ttyACM0
  mcodes:
  # Vacuum/extruder test commands removed. Use plunger or raw gcode send if needed.
motion:
  default_speed: 3200.0     # Default movement speed in mm/min
  rapid_speed: 4800.0       # Fast positioning speed for non-critical moves
  homing_speed: 800.0       # Speed for homing operations (kept conservative for safety)
overflow:
  cells:
  - K3
sorting:
  default_mode: alpha_exact
  low_confidence_threshold: 0.7
  near_full_threshold: 0.9
  modes:
    alpha_exact:
      label: Alphabetical (A–Z)
      type: alpha
      fallback: J3
    price:
      label: Price Ranges
      type: price
      fallback: B1
      thresholds:
        - max: 0.03
          cell: B1
        - min: 0.03
          max: 0.07
          cell: B2
        - min: 0.07
          max: 0.10
          cell: B3
        - min: 0.11
          max: 0.14
          cell: C1
        - min: 0.15
          max: 0.25
          cell: C2
        - min: 0.26
          max: 0.50
          cell: C3
        - min: 0.51
          max: 1.00
          cell: D1
        - min: 1.01
          cell: D2  
    release_year:
      label: Release Year
      type: year
      fallback: K1
      mapping:
        "<=1995": B1
        "1996-2002": B2
        "2003-2009": B3
        "2010-2014": C1
        "2015-2017": C2
        "2018": C3
        "2019": D1
        "2020": D2
        "2021": D3
        "2022": E1
        "2023": E2
        "2024": E3
        ">=2025": F1
        "*": K1
    set_focus:
      label: Set Families
      type: set
      fallback: K2
      mapping:
        mh1: C1
        "modern horizons": C1
        mh2: C1
        grn: D1
        "guilds of ravnica": D1
        rna: D1
        one: D2
        "phyrexia: all will be one": D2
        neo: D3
        "kamigawa: neon dynasty": D3
        otj: E1
        "outlaws of thunder junction": E1
        eld: E2
        "throne of eldraine": E2
        khm: E3
        kaldheim: E3
        "*": K2
camera:
  device: 4  # Use USB webcam at /dev/video4 (HD Camera)
  resolution:
  - 1280
  - 720
  feeders:
  - cell: A1
    roi:
    - 0.0
    - 0.0
    - 0.33
    - 1.0
    empty_threshold: 0.05
    history: 5
  - cell: A2
    roi:
    - 0.33
    - 0.0
    - 0.66
    - 1.0
    empty_threshold: 0.05
    history: 5
  - cell: A3
    roi:
    - 0.66
    - 0.0
    - 1.0
    - 1.0
    empty_threshold: 0.05
    history: 5
  # QR code detection for end-of-feeder markers
  # Place QR codes at the bottom of feeder cells to signal when empty
  # QR code detection - scans full frame for QR codes
  # The machine knows which cell it's positioned at, so we just detect if a QR code is present
  qr_codes:
  - cell: A1
    history: 3  # Require 3 consecutive detections for stable result
    expected_data: "FEEDER_A1_END"  # Verify QR content matches this cell
  - cell: A2
    history: 3
    expected_data: "FEEDER_A2_END"
  - cell: A3
    history: 3
    expected_data: "FEEDER_A3_END"
