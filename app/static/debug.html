<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Processing Debug View</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }
        .header {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            color: #4CAF50;
            font-size: 24px;
        }
        .controls {
            display: flex;
            gap: 10px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .status {
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 14px;
        }
        .status.idle { background: #555; }
        .status.processing { background: #ff9800; }
        .status.success { background: #4CAF50; }
        .status.error { background: #f44336; }
        
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            border: 2px solid #3a3a3a;
        }
        .card h3 {
            color: #4CAF50;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .card img {
            width: 100%;
            height: auto;
            border-radius: 5px;
            margin: 10px 0;
            background: #000;
        }
        .card .meta {
            font-size: 12px;
            color: #aaa;
            line-height: 1.6;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            background: #1a1a1a;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
        .assignment {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            border-left: 4px solid #4CAF50;
        }
        .assignment h2 {
            color: #4CAF50;
            margin-bottom: 15px;
            font-size: 20px;
        }
        .assignment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .assignment-item {
            background: #1a1a1a;
            padding: 12px;
            border-radius: 5px;
        }
        .assignment-item .label {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .assignment-item .value {
            color: #fff;
            font-size: 16px;
            font-weight: bold;
        }
        .assignment-item .cell-value {
            color: #4CAF50;
            font-size: 24px;
        }
        .log {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-entry {
            padding: 5px;
            border-bottom: 1px solid #2a2a2a;
        }
        .log-entry .timestamp {
            color: #888;
            margin-right: 10px;
        }
        .log-entry.error { color: #f44336; }
        .log-entry.success { color: #4CAF50; }
        .log-entry.info { color: #2196F3; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔍 Card Processing Debug View</h1>
        <div class="controls">
            <span id="statusBadge" class="status idle">Idle</span>
            <button id="captureBtn" onclick="captureCard()">Capture & Process Card</button>
            <button onclick="clearLog()">Clear Log</button>
        </div>
    </div>

    <div id="assignmentSection" style="display: none;" class="assignment">
        <h2>📍 Assignment Result</h2>
        <div class="assignment-grid">
            <div class="assignment-item">
                <div class="label">Assigned Cell</div>
                <div class="value cell-value" id="assignedCell">—</div>
            </div>
            <div class="assignment-item">
                <div class="label">Card Name</div>
                <div class="value" id="cardName">—</div>
            </div>
            <div class="assignment-item">
                <div class="label">Set Code</div>
                <div class="value" id="cardSet">—</div>
            </div>
            <div class="assignment-item">
                <div class="label">Collector #</div>
                <div class="value" id="cardCollector">—</div>
            </div>
            <div class="assignment-item">
                <div class="label">Confidence</div>
                <div class="value" id="cardConfidence">—</div>
            </div>
            <div class="assignment-item">
                <div class="label">Reason</div>
                <div class="value" id="assignReason">—</div>
            </div>
            <div class="assignment-item">
                <div class="label">Price (USD)</div>
                <div class="value" id="cardPrice">—</div>
            </div>
            <div class="assignment-item">
                <div class="label">Scryfall ID</div>
                <div class="value" style="font-size: 10px; word-break: break-all;" id="scryfallId">—</div>
            </div>
        </div>
    </div>

    <div id="results" class="results"></div>

    <div class="log">
        <h3 style="color: #4CAF50; margin-bottom: 10px;">Activity Log</h3>
        <div id="logContainer"></div>
    </div>

    <script>
        let logEntries = [];

        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const entry = { timestamp, message, type };
            logEntries.unshift(entry);
            if (logEntries.length > 100) logEntries.pop();
            updateLogDisplay();
        }

        function updateLogDisplay() {
            const container = document.getElementById('logContainer');
            container.innerHTML = logEntries.map(entry => 
                `<div class="log-entry ${entry.type}">
                    <span class="timestamp">[${entry.timestamp}]</span>
                    <span>${entry.message}</span>
                </div>`
            ).join('');
        }

        function clearLog() {
            logEntries = [];
            updateLogDisplay();
        }

        function updateStatus(status, text) {
            const badge = document.getElementById('statusBadge');
            badge.className = `status ${status}`;
            badge.textContent = text;
        }

        async function captureCard() {
            const btn = document.getElementById('captureBtn');
            btn.disabled = true;
            updateStatus('processing', 'Processing...');
            addLog('Starting card capture...', 'info');

            try {
                const response = await fetch('/camera/snapshot?quality=90');
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Snapshot failed');
                }

                addLog(`✓ Snapshot captured successfully`, 'success');
                displayResults(data);
                displayAssignment(data);
                updateStatus('success', 'Success');
                addLog('Processing complete', 'success');

            } catch (error) {
                addLog(`✗ Error: ${error.message}`, 'error');
                updateStatus('error', 'Error');
            } finally {
                btn.disabled = false;
                setTimeout(() => updateStatus('idle', 'Idle'), 3000);
            }
        }

        function displayAssignment(data) {
            const section = document.getElementById('assignmentSection');
            const assignment = data.assignment || {};
            const card = assignment.card || {};
            
            document.getElementById('assignedCell').textContent = assignment.cell || 'N/A';
            document.getElementById('cardName').textContent = card.name || 'Unknown';
            document.getElementById('cardSet').textContent = card.set_code || 'N/A';
            document.getElementById('cardCollector').textContent = card.collector_number || 'N/A';
            document.getElementById('cardConfidence').textContent = card.confidence 
                ? `${(card.confidence * 100).toFixed(1)}%` 
                : 'N/A';
            document.getElementById('assignReason').textContent = assignment.reason || 'N/A';
            document.getElementById('cardPrice').textContent = card.price_usd 
                ? `$${card.price_usd}` 
                : 'N/A';
            document.getElementById('scryfallId').textContent = card.scryfall_id || 'N/A';

            section.style.display = 'block';

            addLog(`Card identified: ${card.name || 'Unknown'}`, 'success');
            addLog(`Assigned to cell: ${assignment.cell}`, 'success');
            addLog(`Reason: ${assignment.reason}`, 'info');
        }

        function displayResults(data) {
            const container = document.getElementById('results');
            container.innerHTML = '';

            const frames = data.frames || [];
            addLog(`Received ${frames.length} processing frames`, 'info');

            // Define order and labels for display
            const frameOrder = [
                { label: 'original', title: '📷 Original Capture' },
                { label: 'rotated', title: '🔄 Rotated' },
                { label: 'aligned', title: '📐 Aligned' },
                { label: 'flipped', title: '🔃 Flipped' },
                { label: 'ocr_prepared', title: '🔍 OCR Prepared' },
                { label: 'ocr_text', title: '📝 OCR Text Result' }
            ];

            frameOrder.forEach(({ label, title }) => {
                const frame = frames.find(f => f.label === label);
                if (!frame) return;

                const card = document.createElement('div');
                card.className = 'card';

                const heading = document.createElement('h3');
                heading.textContent = title;
                card.appendChild(heading);

                // Display image if available
                if (frame.image) {
                    const img = document.createElement('img');
                    img.src = `data:${frame.mime || 'image/jpeg'};base64,${frame.image}`;
                    img.alt = title;
                    card.appendChild(img);
                    addLog(`✓ ${title} rendered`, 'info');
                }

                // Display text/meta if available
                if (frame.text || frame.meta) {
                    const meta = document.createElement('div');
                    meta.className = 'meta';
                    
                    let metaText = '';
                    if (frame.text) {
                        metaText += JSON.stringify(frame.text, null, 2);
                    }
                    if (frame.meta) {
                        if (metaText) metaText += '\n\n---\n\n';
                        metaText += JSON.stringify(frame.meta, null, 2);
                    }
                    if (frame.shape) {
                        metaText += `\n\nShape: ${JSON.stringify(frame.shape)}`;
                    }
                    
                    meta.textContent = metaText;
                    card.appendChild(meta);
                }

                container.appendChild(card);
            });
        }

        // Auto-update log on load
        addLog('Debug viewer ready', 'success');
    </script>
</body>
</html>
