<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sort.me</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <h1>sort.me</h1>
        </div>
        <div class="status-bar">
            <span id="motionStatus" class="status-chip">Motion: -</span>
            <span id="cameraStatus" class="status-chip">Camera: -</span>
            <button id="estopBtn" class="btn-danger">E-STOP</button>
        </div>
    </header>

    <main class="container">
        <section class="panel">
            <h2>Sorting Setup</h2>
            <div class="form-group">
                <label for="sortType">Sort Type</label>
                <select id="sortType" class="form-control">
                    <option value="alpha_exact">Alphabetical</option>
                    <option value="price">Price</option>
                </select>
            </div>
        </section>

        <section class="panel">
            <h2>Motion Controls</h2>
            <div class="form-group">
                <label for="jogDistance">Jog Distance (mm)</label>
                <select id="jogDistance" class="form-control">
                    <option value="0.1">0.1mm (Fine)</option>
                    <option value="1">1mm</option>
                    <option value="5">5mm</option>
                    <option value="10" selected>10mm (Default)</option>
                    <option value="25">25mm</option>
                    <option value="50">50mm</option>
                    <option value="100">100mm (Coarse)</option>
                </select>
            </div>
            <div class="motion-grid">
                <button class="btn-secondary" onclick="jogMotion('Y', 'jogDistance')">Y+</button>
                <button class="btn-secondary" onclick="jogMotion('Z', 'jogDistance')">Z+</button>
                <button class="btn-secondary" onclick="jogMotion('Y', '-jogDistance')">Y-</button>
                <button class="btn-secondary" onclick="jogMotion('X', 'jogDistance')">X+</button>
                <button class="btn-secondary" onclick="homeMotion()">Home</button>
                <button class="btn-secondary" onclick="jogMotion('X', '-jogDistance')">X-</button>
                <button></button>
                <button class="btn-secondary" onclick="jogMotion('Z', '-jogDistance')">Z-</button>
                <button></button>
            </div>
        </section>

        <section class="panel" style="grid-column: 1 / -1;">
            <h2>Cell Grid</h2>
            <div id="cellGrid" class="cell-grid"></div>
        </section>

        <section class="panel">
            <h2>Single Card Test</h2>
            <button id="snapshotBtn" class="btn-primary" onclick="takeSingleSnapshot()">
                Capture Card
            </button>
            <div id="snapshotResult" class="result-area"></div>
        </section>

        <section class="panel">
            <h2>Auto Sort</h2>
            <button id="beginSortBtn" class="btn-success" onclick="beginAutoSort()">
                Begin Sorting
            </button>
            <button id="stopSortBtn" class="btn-danger" onclick="stopAutoSort()" style="display:none;">
                Stop Sorting
            </button>
            <div id="sortStatus" class="sort-status"></div>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
